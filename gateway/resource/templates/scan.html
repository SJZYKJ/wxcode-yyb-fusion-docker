<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>添加账号 - YYB Go</title>
  <link rel="stylesheet" href="/static/css/platform.css">
  <style>
    :root { color-scheme: light; --bg:#f5f6f8; --surface:#fff; --ink:#20242b; --muted:#68707d; --line:#dde1e7; --primary:#c53255; --primary-hover:#a82445; --success:#287a49; --success-soft:#edf8f1; --danger:#b53636; --radius:8px; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
    button,input { font:inherit; } button { cursor:pointer; }
    .topbar { min-height:64px; display:flex; align-items:center; justify-content:space-between; gap:16px; padding:12px 24px; background:var(--surface); border-bottom:1px solid var(--line); }
    .brand { display:flex; align-items:center; gap:11px; min-width:0; }
    .mark { width:36px; height:36px; border-radius:var(--radius); display:grid; place-items:center; background:var(--ink); color:#fff; font-weight:800; }
    .brand h1 { margin:0; font-size:18px; line-height:1.2; letter-spacing:0; }
    .brand p { margin:2px 0 0; color:var(--muted); font-size:12px; }
    .link { color:var(--ink); text-decoration:none; border:1px solid var(--line); border-radius:var(--radius); padding:8px 12px; background:#fff; }
    main { width:min(920px,calc(100% - 32px)); margin:32px auto; display:grid; grid-template-columns:minmax(300px,380px) minmax(0,1fr); gap:20px; align-items:start; }
    .panel { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; }
    .head { padding:18px 20px; border-bottom:1px solid var(--line); }
    .head h2 { margin:0; font-size:17px; letter-spacing:0; }
    .head p { margin:4px 0 0; color:var(--muted); font-size:13px; }
    .body { padding:20px; }
    .mode-switch { display:grid; grid-template-columns:1fr 1fr; gap:4px; margin-bottom:18px; padding:4px; background:#eef0f3; border-radius:var(--radius); }
    .mode-button { min-height:36px; border:0; border-radius:6px; background:transparent; color:var(--muted); font-weight:650; }
    .mode-button[aria-selected="true"] { background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(25,31,40,.12); }
    .mode-pane[hidden] { display:none; }
    .qr { width:min(100%,280px); aspect-ratio:1; margin:0 auto; display:grid; place-items:center; background:#fafafa; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; color:var(--muted); }
    .qr img { width:100%; height:100%; object-fit:contain; }
    .quick-state { min-height:280px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; text-align:center; padding:24px; background:#fafafa; border:1px solid var(--line); border-radius:var(--radius); }
    .quick-avatar { width:72px; height:72px; border-radius:50%; display:grid; place-items:center; object-fit:cover; background:#e8eaee; color:var(--muted); font-size:22px; font-weight:750; }
    .quick-state strong { font-size:16px; }
    .quick-state span { max-width:260px; color:var(--muted); font-size:13px; }
    .check { font-size:54px; color:var(--success); }
    .status { min-height:24px; margin:16px 0 0; text-align:center; font-weight:600; }
    .status.pending { color:var(--muted); } .status.scanned { color:#2166a5; } .status.ok { color:var(--success); } .status.error { color:var(--danger); }
    .countdown { min-height:18px; margin-top:2px; text-align:center; color:var(--muted); font-size:12px; }
    .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:18px; }
    .btn { min-height:38px; border:1px solid var(--line); border-radius:var(--radius); padding:8px 13px; display:inline-flex; align-items:center; justify-content:center; gap:7px; background:#fff; color:var(--ink); }
    .btn:hover { background:#f5f6f8; } .btn.primary { background:var(--primary); border-color:var(--primary); color:#fff; } .btn.primary:hover { background:var(--primary-hover); } .btn:disabled { cursor:wait; opacity:.6; }
    .account { display:none; }
    .account.visible { display:block; }
    .identity { padding:14px; background:var(--success-soft); border:1px solid #cde7d6; border-radius:var(--radius); }
    .identity strong { display:block; color:var(--success); font-size:16px; margin-bottom:8px; }
    .row { display:grid; grid-template-columns:64px minmax(0,1fr); gap:10px; padding:5px 0; }
    .row span { color:var(--muted); } code { overflow-wrap:anywhere; font-family:ui-monospace,SFMono-Regular,Consolas,monospace; }
    .field { margin-top:18px; } .field label { display:block; margin-bottom:6px; font-weight:650; }
    .field small { display:block; margin-top:5px; color:var(--muted); }
    .input { width:100%; min-height:40px; border:1px solid var(--line); border-radius:var(--radius); padding:8px 10px; color:var(--ink); background:#fff; }
    .input:focus { outline:2px solid color-mix(in srgb,var(--primary) 24%,transparent); border-color:var(--primary); }
    .message { min-height:20px; margin-top:12px; color:var(--muted); font-size:13px; }
    .message.ok { color:var(--success); } .message.error { color:var(--danger); }
    .placeholder { color:var(--muted); padding:6px 0; }
    @media (max-width:720px) { .topbar { padding:10px 16px; } .brand p { display:none; } main { margin:16px auto; grid-template-columns:1fr; } .actions .btn { flex:1 1 140px; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; transition:none!important; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><div class="mark">Y</div><div><h1>添加微信账号</h1><p>授权成功后可直接同步到青龙</p></div></div>
    <a class="link" href="/">返回控制台</a>
  </header>
  <main>
    <section class="panel">
      <div class="head"><h2>微信授权</h2><p>选择本机微信确认或手机扫码</p></div>
      <div class="body">
        <div class="mode-switch" role="tablist" aria-label="授权方式">
          <button class="mode-button" id="quickModeBtn" type="button" role="tab" aria-selected="true" aria-controls="quickPane">本机微信</button>
          <button class="mode-button" id="qrModeBtn" type="button" role="tab" aria-selected="false" aria-controls="qrPane">扫码</button>
        </div>
        <div class="mode-pane" id="quickPane" role="tabpanel" aria-labelledby="quickModeBtn">
          <div class="quick-state" id="quickState" role="status" aria-live="polite">
            <div class="quick-avatar" id="quickAvatar">微</div>
            <strong id="quickName">正在检测本机微信</strong>
            <span id="quickDetail">请保持电脑微信已登录且未锁定</span>
          </div>
          <div class="actions">
            <button class="btn primary" id="quickAuthBtn" type="button" disabled>使用本机微信授权</button>
            <button class="btn" id="quickRetryBtn" type="button">重新检测</button>
          </div>
        </div>
        <div class="mode-pane" id="qrPane" role="tabpanel" aria-labelledby="qrModeBtn" hidden>
          <div class="qr" id="qrWrap">准备生成二维码</div>
          <div class="status pending" id="status">等待生成二维码</div>
          <div class="countdown" id="countdown"></div>
          <div class="actions">
            <button class="btn" id="refreshBtn" type="button">重新生成</button>
          </div>
        </div>
        <div class="actions"><button class="btn" id="backBtn" type="button">账号列表</button></div>
      </div>
    </section>
    <section class="panel">
      <div class="head"><h2>账号信息</h2><p>备注用于账号运行管理和青龙任务名称</p></div>
      <div class="body">
        <div class="placeholder" id="accountPlaceholder">授权成功后将在这里显示账号信息。</div>
        <div class="account" id="accountBox">
          <div class="identity">
            <strong id="accountName">-</strong>
            <div class="row"><span>ID</span><code id="accountId">-</code></div>
            <div class="row"><span>OpenID</span><code id="accountOpenid">-</code></div>
            <div class="row"><span>状态</span><code id="accountStatus">-</code></div>
          </div>
          <div class="field">
            <label for="remarkInput">账号备注</label>
            <input class="input" id="remarkInput" maxlength="80" placeholder="例如：Boom、微信账号 2" autocomplete="off">
            <small>运行管理中显示为“账号 ID · 备注”，脚本仍按账号 ID 运行。</small>
          </div>
          <div class="actions">
            <button class="btn" id="saveRemarkBtn" type="button">保存备注</button>
            <button class="btn primary" id="syncBtn" type="button">添加到青龙</button>
            <button class="btn" id="copyBtn" type="button">复制 OpenID</button>
          </div>
          <div class="message" id="actionMessage" role="status"></div>
        </div>
      </div>
    </section>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    const QR_TTL = 110;
    let sid = null, account = null, pollTimer = null, countdownTimer = null, seconds = 0;
    let quickConfig = null, quickPort = null, quickProfile = null, quickBusy = false;
    async function api(method,url,body) { const options={method,headers:{"Content-Type":"application/json"}}; if(body!==undefined) options.body=JSON.stringify(body); const response=await fetch(url,options); const text=await response.text(); let payload=null; try{payload=text?JSON.parse(text):null}catch{payload=text} const envelope=payload&&typeof payload==="object"&&!Array.isArray(payload)&&"code" in payload&&"data" in payload; if(!response.ok||(envelope&&payload.code!==0)) throw new Error(envelope?payload.msg:`HTTP ${response.status}`); return envelope?payload.data:payload; }
    function stopTimers(){ if(pollTimer) clearInterval(pollTimer); if(countdownTimer) clearInterval(countdownTimer); pollTimer=countdownTimer=null; }
    function setStatus(text,type="pending"){ $("status").textContent=text; $("status").className=`status ${type}`; }
    function setMessage(text,type=""){ $("actionMessage").textContent=text; $("actionMessage").className=`message ${type}`; }
    function showMode(mode){ const quick=mode==="quick"; $("quickPane").hidden=!quick; $("qrPane").hidden=quick; $("quickModeBtn").setAttribute("aria-selected",String(quick)); $("qrModeBtn").setAttribute("aria-selected",String(!quick)); if(quick){stopTimers();sid=null;if(!quickConfig&&!quickBusy)detectQuickLogin();}else if(!sid){newQR();} }
    function resetAccount(){ account=null; $("accountBox").classList.remove("visible"); $("accountPlaceholder").hidden=false; setMessage(""); }
    function showAccount(nextAccount){ account=nextAccount; $("accountName").textContent=account.remark||account.nickname||account.alias||account.openid; $("accountId").textContent=String(account.id); $("accountOpenid").textContent=account.openid||"-"; $("accountStatus").textContent=account.status||"unknown"; $("remarkInput").value=account.remark||""; $("accountPlaceholder").hidden=true; $("accountBox").classList.add("visible"); }
    function setQuickState(name,detail,avatar){ $("quickName").textContent=name; $("quickDetail").textContent=detail; if(avatar){ const img=document.createElement("img"); img.className="quick-avatar"; img.alt="微信头像"; img.src=avatar; $("quickAvatar").replaceWith(img); img.id="quickAvatar"; }else if($("quickAvatar").tagName==="IMG"){ const div=document.createElement("div"); div.className="quick-avatar"; div.id="quickAvatar"; div.textContent="微"; $("quickAvatar").replaceWith(div); } }
    function parseLocalResponse(text){ let value=JSON.parse(text); if(typeof value==="string") value=JSON.parse(value); return value; }
    async function localWechat(port,path,body,timeout=3000){ const controller=new AbortController(); const timer=setTimeout(()=>controller.abort(),timeout); try{ const response=await fetch(`https://localhost.weixin.qq.com:${port}${path}`,{method:"POST",cache:"no-store",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),signal:controller.signal}); if(!response.ok) throw new Error(`HTTP ${response.status}`); return parseLocalResponse(await response.text()); }finally{clearTimeout(timer);} }
    function checkLoginBody(){ return {apiname:"qrconnectchecklogin",jsdata:{appid:quickConfig.appid,scope:quickConfig.scope,redirect_uri:quickConfig.redirect_uri,state:quickConfig.state}}; }
    async function detectQuickLogin(){ if(quickBusy)return; quickBusy=true; quickConfig=null; quickPort=null; quickProfile=null; $("quickAuthBtn").disabled=true; setQuickState("正在检测本机微信","请保持电脑微信已登录且未锁定"); try{ quickConfig=await api("POST","/quick-login"); const results=await Promise.all(quickConfig.ports.map(async port=>{try{return {port,data:await localWechat(port,"/api/check-login",checkLoginBody())};}catch{return null;}})); const match=results.find(item=>item&&Number(item.data?.errcode)===0&&item.data?.jsdata?.authorize_uuid); if(!match) throw new Error("未检测到可用的桌面微信"); quickPort=match.port; quickProfile=match.data.jsdata; setQuickState(quickProfile.nickname||"本机微信已就绪","点击下方按钮后在电脑微信中确认",quickProfile.headimgurl||""); $("quickAuthBtn").disabled=false; }catch(error){ quickConfig=null; setQuickState("本机快速授权不可用","已切换到扫码授权"); setTimeout(()=>showMode("qr"),500); }finally{quickBusy=false;} }
    function authorizePosition(){ const width=360,height=263,left=window.screenX||window.screenLeft||0,top=window.screenY||window.screenTop||0; return {x:Math.round(left+(window.outerWidth||window.innerWidth)/2-width/2),y:Math.round(top+(window.outerHeight||window.innerHeight)/2-height/2)}; }
    async function authorizeQuick(){ if(!quickConfig||!quickPort||!quickProfile||quickBusy)return; quickBusy=true; const button=$("quickAuthBtn"); button.disabled=true; button.textContent="等待微信确认"; resetAccount(); try{ const result=await localWechat(quickPort,"/api/authorize",{apiname:"qrconnectfastauthorize",jsdata:{data:JSON.stringify(authorizePosition()),appid:quickConfig.appid,scope:quickConfig.scope,redirect_uri:quickConfig.redirect_uri,state:quickConfig.state,authorize_uuid:quickProfile.authorize_uuid}},120000); const errcode=Number(result?.errcode); if(errcode===10050) throw new Error("已在微信中拒绝授权，请重新检测"); if(errcode===10046) throw new Error("授权已超时，请重新检测"); if(errcode===10057){ showMode("qr"); throw new Error("当前应用仅支持扫码授权"); } if(errcode!==0||!result?.jsdata?.redirect_url) throw new Error("桌面微信未返回有效授权结果，请重新检测"); setQuickState("授权成功","正在保存账号",quickProfile.headimgurl||""); const nextAccount=await api("POST",`/quick-login/${quickConfig.session_id}/confirm`,{redirect_url:result.jsdata.redirect_url}); showAccount(nextAccount); setQuickState("账号添加成功",nextAccount.remark||nextAccount.nickname||nextAccount.openid,quickProfile.headimgurl||""); }catch(error){ setQuickState("快速授权失败",error.message,quickProfile?.headimgurl||""); quickConfig=null; quickPort=null; quickProfile=null; }finally{quickBusy=false;button.disabled=!quickConfig;button.textContent="使用本机微信授权";} }
    function startCountdown(){ seconds=QR_TTL; $("countdown").textContent=`二维码 ${seconds}s 后自动刷新`; countdownTimer=setInterval(()=>{ seconds-=1; $("countdown").textContent=seconds>0?`二维码 ${seconds}s 后自动刷新`:"二维码已过期，正在刷新"; if(seconds<=0){stopTimers();newQR();} },1000); }
    async function newQR(){ stopTimers(); resetAccount(); sid=null; $("qrWrap").textContent="正在生成二维码"; $("countdown").textContent=""; setStatus("正在获取二维码"); try{ const result=await api("POST","/qr"); sid=result.session_id; $("qrWrap").innerHTML=`<img src="${result.image_url}?t=${Date.now()}" alt="微信登录二维码">`; setStatus("等待扫码"); startCountdown(); pollTimer=setInterval(poll,1500); }catch(error){setStatus(`获取二维码失败：${error.message}`,"error");} }
    async function poll(){ if(!sid)return; try{ const result=await api("GET",`/qr/${sid}/poll`); if(result.status==="pending") setStatus("等待扫码"); else if(result.status==="scanned") setStatus("已扫码，请在手机上确认","scanned"); else if(result.status==="authorized"||result.status==="confirmed"){stopTimers();confirm();} else if(result.status==="expired"||result.status==="unknown"){stopTimers();setStatus("二维码已失效，正在重新生成","error");newQR();} else if(result.status==="cancelled"){stopTimers();setStatus("已取消，请重新生成二维码","error");} }catch{} }
    async function confirm(){ $("countdown").textContent=""; setStatus("授权成功，正在保存账号","scanned"); try{ const nextAccount=await api("POST",`/qr/${sid}/confirm`); showAccount(nextAccount); $("qrWrap").innerHTML='<span class="check">✓</span>'; setStatus("账号添加成功","ok"); }catch(error){setStatus(`保存账号失败：${error.message}`,"error");} }
    async function saveRemark(silent=false){ if(!account)return false; const button=$("saveRemarkBtn"); button.disabled=true; try{ const result=await api("PUT","/accounts/remark",{ref:String(account.id),remark:$("remarkInput").value}); account=result.account; if(!silent) setMessage(result.warning||"备注已保存",result.warning?"error":"ok"); return true; }catch(error){setMessage(`备注保存失败：${error.message}`,"error"); return false;}finally{button.disabled=false;} }
    async function syncAccount(){ if(!account)return; const button=$("syncBtn"); button.disabled=true; button.textContent="正在添加"; setMessage("正在保存备注并同步青龙"); try{ if(!await saveRemark(true))return; const result=await api("POST","/api/qinglong/sync",{ref:String(account.id)}); setMessage(result.added?`已添加到青龙 YYB_SERVER：账号 ${account.id}`:`青龙 YYB_SERVER 已包含账号 ${account.id}，无需重复添加`,"ok"); button.textContent="已添加到青龙"; }catch(error){ setMessage(error.message.includes("配置")?"尚未配置青龙，请返回控制台填写青龙连接信息。":`同步失败：${error.message}`,"error"); button.textContent="添加到青龙"; }finally{button.disabled=false;} }
    $("quickModeBtn").addEventListener("click",()=>showMode("quick")); $("qrModeBtn").addEventListener("click",()=>showMode("qr")); $("quickAuthBtn").addEventListener("click",authorizeQuick); $("quickRetryBtn").addEventListener("click",detectQuickLogin); $("refreshBtn").addEventListener("click",newQR); $("backBtn").addEventListener("click",()=>{stopTimers();location.href="/";}); $("saveRemarkBtn").addEventListener("click",()=>saveRemark()); $("syncBtn").addEventListener("click",syncAccount); $("copyBtn").addEventListener("click",async()=>{ try{await navigator.clipboard.writeText(account?.openid||"");setMessage("OpenID 已复制","ok");}catch{setMessage("复制失败，请手动选择 OpenID","error");} });
    detectQuickLogin();
  </script>
  <script src="/static/js/platform.js"></script>
</body>
</html>
