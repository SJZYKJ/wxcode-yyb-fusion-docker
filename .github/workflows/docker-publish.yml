# ==============================================================================
# 在 GitHub Actions 上构建镜像，并推送到 Docker Hub
#
# 为什么用云端构建（而不是本机）：
#   本机无需安装 Docker Desktop / WSL2，也不需要重启，
#   构建在 GitHub 的 runner 上完成，产物直接推到 Docker Hub。
#   之后任何机器只要一句 docker compose up -d 就能部署。
#
# —— 使用前只需做一次（约 3 分钟）——
#
#   1. 把本目录推到一个 GitHub 仓库（私有仓库也可以）
#
#   2. 到仓库 Settings → Secrets and variables → Actions → New repository secret
#        名称：DOCKERHUB_USERNAME   值：你的 Docker Hub 用户名
#        名称：DOCKERHUB_TOKEN      值：在 https://hub.docker.com/settings/security
#                                      点 "New Access Token" 生成的令牌
#      ⚠ 请使用 Access Token，不要用账号登录密码
#
#   3. 触发构建，任选一种：
#        · 推送到 main / master 分支（最常用）
#        · 到仓库 Actions 页面，选 "构建并推送镜像到 Docker Hub" → Run workflow
#
# —— 镜像标签规则（v2 版，统一约定，改之前请先读完）——
#
#   每次构建推两个标签，命名全部由 CI 自动生成，不需要手工维护版本文件：
#
#     v<N>      正式发布号。N 是**全局单调递增**的整数，永不重置、永不复用。
#               固定版本 / 回滚都用它，例：v7 → v8 → v9。
#     latest    默认分支最新一次成功构建的快捷方式（会动，别用它做回滚）。
#
#   ⚠️ 历史教训：旧方案是 SHA-<月日>-V<n>.0，序号**按天重置**——于是
#   昨天的 V4.0 比今天的 V1.0 旧，序号之间无法比较大小，每次构建的标签
#   都不一样也没法判断先后。v2 方案用全局计数器彻底解决这一点。
#
#   N 的来源（两条路，按顺序判断）：
#     ① 本次提交上**已经有人工打的** `v<N>` 或 `v<N>.<M>` 标签 → 直接沿用。
#        想发一个指定的号（如 v7.1）就手工打标签，不必改任何代码：
#          git tag v7.1 && git push origin v7.1 && git push origin HEAD:main
#        ⚠️ 顺序不能反：标签要先到远端，否则 CI 算号时看不到它。
#     ② 没有指定 → 全仓库最大序号 + 1。兼容 `v<N>`、`v<N>.<M>`、历史遗留
#        `SHA-<月日>-V<n>.<m>`；只比较主号，所以 v7.1 之后的自动号是 v8。
#   标签与 Release 由 CI 在构建成功后自动创建，GitHub 与 Docker Hub
#   两边的版本号始终一致；提交 SHA 记录在 Release 说明里，不占用标签名。
#
#   ⚠️ 别把作废的号留在仓库里：序号取自「现有标签的最大值 + 1」，
#   旧标签没删干净，下一个号就会跳号。清理在 Actions →
#   「删除 Docker Hub 镜像标签」+ 删掉对应的 Git 标签/Release。
#
#   ⚠️ README 顶部的「版本摘要」是**人工维护的用户可见版本号**，和这里的
#   自动计数不是一回事，允许不一致；发版时按需手工加条目即可。
#
# —— 构建结果 ——
#   镜像地址：<DOCKERHUB_USERNAME>/wxcode-yyb-fusion:latest
#   部署时在 .env 里填：IMAGE_REPO=<DOCKERHUB_USERNAME>/wxcode-yyb-fusion
#   固定版本：在 .env 里设 IMAGE_TAG=v5（换成你要的号即可）
#   回滚：IMAGE_TAG 改成上一个 `v<N>` 再 `docker compose up -d`；
#         要精确到提交，去对应 Release 说明里看提交 SHA
#         （GitHub → Releases → 选版本 → 见「提交」一行）
#
# —— 本项目的特殊之处 ——
#   gateway/ 下已经放了交叉编译好的 linux/amd64 与 linux/arm64 二进制，
#   Dockerfile 只是 COPY，不做 Go 编译，所以双架构构建也很便宜。
#   ⚠️ 改了 src/ 下的 Go 代码后，必须先在本机跑 ./build-gateway.sh
#      重新生成 gateway/ 里的二进制并提交，否则镜像里还是旧代码。
# ==============================================================================

name: 构建并推送镜像到 Docker Hub

on:
  push:
    branches:
      - main
      - master
  # 允许在网页上手动触发，并可额外指定一个镜像标签
  workflow_dispatch:
    inputs:
      tag:
        description: '额外要推送的镜像标签（可留空）'
        required: false
        default: ''

# 串行化同一分支的构建，避免两次构建算出同一个版本序号
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: wxcode-yyb-fusion

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # 需要写权限来打 Git 标签、建 Release
    steps:
      - name: 拉取代码（含全部标签，用于计算版本序号）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 校验双架构预编译二进制已入库
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            f="gateway/yyb-go-${arch}"
            if [ ! -f "$f" ]; then
              echo "::error::缺少 $f —— 请先在本机运行 ./build-gateway.sh 并提交产物"
              exit 1
            fi
            head -c 4 "$f" | od -An -tx1 | tr -d ' \n' | grep -q '^7f454c46' \
              || { echo "::error::$f 不是 ELF 文件"; exit 1; }
            echo "  ok  $f  ($(du -h "$f" | cut -f1))"
          done

      - name: 准备 QEMU（用于跨架构构建）
        uses: docker/setup-qemu-action@v3

      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 计算本次版本号
        id: ver
        run: |
          set -uo pipefail
          git fetch --tags --force --quiet 2>/dev/null || true

          # ① 本次提交上如果已经有人手工打过版本标签，就直接沿用 ——
          #    发一个「指定号」（如 v7.1）不需要改任何代码或配置：
          #      git tag v7.1 && git push origin v7.1 && git push origin HEAD:main
          #    顺序不能反：标签必须先到远端，否则 CI 算号时还看不到它。
          PINNED=$(git tag --points-at "${GITHUB_SHA}" \
                     | grep -E '^v[0-9]+(\.[0-9]+)?$' | sort -V | tail -1 || true)
          if [ -n "${PINNED}" ]; then
            VERSION="${PINNED}"
            NOTE="取自本次提交上的标签（人工指定的发布号）"
          else
            # ② 没有指定就自动递增：全仓库最大序号 + 1，**永不按天重置、永不复用**。
            #    同时兼容：v12 -> 12、v7.1 -> 7、历史遗留 SHA-0917-V4.0 -> 4。
            #    注意只取「主号」比较大小，所以 v7.1 之后的自动号是 v8（不是 v7.2）。
            MAX=$(git tag -l | sed -nE \
                    -e 's/^v([0-9]+)(\.[0-9]+)?$/\1/p' \
                    -e 's/^SHA-[0-9]{4}-V([0-9]+)\.[0-9]+$/\1/p' \
                  | sort -n | tail -1)
            MAX=${MAX:-0}
            N=$((MAX + 1))
            VERSION="v${N}"
            NOTE="全局第 ${N} 号发布；序号单调递增、永不重置，取自本仓库 Git 标签"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "### 本次版本：\`${VERSION}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "（${NOTE}）" >> "$GITHUB_STEP_SUMMARY"

      - name: 生成镜像标签与元数据（latest / 可选自定义标签）
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            # 默认分支构建 -> latest
            type=raw,value=latest,enable={{is_default_branch}}
            # 正式版本号 v<N> 由「构建并推送」步骤直接拼上，这里不再生成，
            # 以保证 Docker Hub 上只有 latest 和 v<N> 两种标签，不产生噪音。
            # 网页手动触发时可额外附加一个自定义标签（可留空）
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}

      - name: 构建并推送
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # 两个架构都要：网关本身就在 ARM 服务器上跑得不少，而 Dockerfile
          # 只是 COPY 预编译二进制，多架构几乎不增加构建时间
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}
          # 把本次版本号烧进镜像：登录页显示的「当前版本」读的就是它，
          # 所以以后发版不必再改登录页（对应 Dockerfile 的 ARG VERSION）
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          # 复用构建缓存，后续构建只需 1-2 分钟
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 打 Git 标签并创建 GitHub Release
        # 只在推送分支时做；手动触发的构建不打标签
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
          REPO: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
        run: |
          set -uo pipefail

          SHORT=$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)
          # 不用 heredoc：YAML 块标量会给每行带上缩进，写进文件会破坏 Markdown
          {
            printf '## 镜像\n\n'
            printf '```\n'
            printf '%s:%s\n' "${REPO}" "${VERSION}"
            printf '%s:latest\n' "${REPO}"
            printf '```\n\n'
            printf -- '- 摘要：`%s`\n' "${DIGEST}"
            printf -- '- 平台：`linux/amd64`、`linux/arm64`\n'
            printf -- '- 提交：`%s`（短号 `%s`）\n\n' "${GITHUB_SHA}" "${SHORT}"
            printf '## 部署\n\n'
            printf '```bash\n'
            printf 'docker compose pull && docker compose up -d\n'
            printf '```\n\n'
            printf '固定到本版本：在 `.env` 里设 `IMAGE_TAG=%s`。\n\n' "${VERSION}"
            printf '回滚：把 `.env` 里的 `IMAGE_TAG` 改成上一个 `v<N>` 再 `up -d`；\n'
            printf '要精确到提交，按上面的提交 SHA 与本页核对即可。\n'
          } > /tmp/notes.md

          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "Release ${VERSION} 已存在，更新说明"
            gh release edit "${VERSION}" --notes-file /tmp/notes.md
          else
            gh release create "${VERSION}" \
              --target "${GITHUB_SHA}" \
              --title "${VERSION}" \
              --notes-file /tmp/notes.md
          fi

      - name: 输出镜像地址
        run: |
          echo "### 镜像已推送到 Docker Hub :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "摘要：\`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "部署时在项目 .env 里填：\`IMAGE_REPO=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
