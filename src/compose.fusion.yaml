services:
  yyb-go:
    build:
      context: .
      dockerfile: Dockerfile.fusion
    image: local/wxcode-yyb-fusion:2.0.4
    container_name: wxcode-yyb-fusion
    restart: unless-stopped
    command:
      - -host
      - 0.0.0.0
      - -port
      - "8088"
      - -resource-root
      - /app/resource
      - -keepalive-interval
      - ${YYB_KEEPALIVE_INTERVAL:-30m}
      - -keepalive-ahead
      - ${YYB_KEEPALIVE_AHEAD:-45m}
    environment:
      # 手机端取码源：wxcode APK 在手机上监听 8088；如用 Zygisk 融合模块则填手机IP:8089
      WXCODE_URLS: ${WXCODE_URLS:-http://192.168.1.100:8088}
      WXCODE_HOOK_PORT: ${WXCODE_HOOK_PORT:-8088}
      PANEL_TYPE: ${PANEL_TYPE:-qinglong}
      QL_URL: ${QL_URL:-}
      QL_CLIENT_ID: ${QL_CLIENT_ID:-}
      QL_CLIENT_SECRET: ${QL_CLIENT_SECRET:-}
      DAIDAI_URL: ${DAIDAI_URL:-}
      DAIDAI_APP_KEY: ${DAIDAI_APP_KEY:-}
      DAIDAI_APP_SECRET: ${DAIDAI_APP_SECRET:-}
      YYB_QINGLONG_SERVER: ${YYB_QINGLONG_SERVER:-}
      YYB_QINGLONG_REPO: ${YYB_QINGLONG_REPO:-}
      YYB_DNS_SERVERS: ${YYB_DNS_SERVERS:-223.5.5.5:53,119.29.29.29:53}
      YYB_AUTH_DRIVER: ${YYB_AUTH_DRIVER:-sqlite}
      YYB_AUTH_DSN: ${YYB_AUTH_DSN:-}
      YYB_AUTH_MYSQL_DSN: ${YYB_AUTH_MYSQL_DSN:-}
      YYB_ADMIN_USER: ${YYB_ADMIN_USER:-admin}
      YYB_ADMIN_PASSWORD: ${YYB_ADMIN_PASSWORD:-}
      YYB_COOKIE_SECURE: ${YYB_COOKIE_SECURE:-false}
      GIN_MODE: release
    volumes:
      - ./data/db:/app/resource/db
      - ./data/avatars:/app/resource/avatars
      - ./data/qr:/app/resource/qr
    ports:
      - "${YYB_BIND_ADDRESS:-0.0.0.0}:${YYB_PORT:-8088}:8088"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8088/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    cap_drop:
      - ALL
