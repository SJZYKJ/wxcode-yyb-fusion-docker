<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>wxcode-YYB 账号授权</title>
  <script>try{var theme=localStorage.getItem("yyb-skin");if(theme==="light"||theme==="dark")document.documentElement.dataset.theme=theme}catch(e){}</script>
  <link rel="stylesheet" href="/static/css/scan-channel.css?v=20261112-graphite">
  <link rel="stylesheet" href="/static/css/account-link-multi.css?v=20261112-graphite">
  <style>
    /* 独立授权页：不加载壳层，配色与主站「青石墨」一致（深色优先 + 明色回退）。 */
    :root {
      color-scheme: dark;
      --bg: #0B1014;
      --surface: rgba(19, 30, 36, 0.86);
      --surface-2: rgba(24, 37, 44, 0.9);
      --line: rgba(126, 163, 172, 0.18);
      --line-strong: rgba(126, 163, 172, 0.32);
      --ink: #E8F1F2;
      --ink-2: #C3D5D7;
      --muted: #849DA2;
      --primary: #0FB6A6;
      --primary-2: #0E7C74;
      --primary-ink: #04211F;
      --accent: #F5A524;
      --accent-soft: rgba(245, 165, 36, 0.12);
      --danger: #F04438;
      --success: #2ED3A0;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: light;
        --bg: #F2F6F6;
        --surface: #FFFFFF;
        --surface-2: #F6FAFA;
        --line: rgba(12, 34, 40, 0.1);
        --line-strong: rgba(12, 34, 40, 0.2);
        --ink: #0C1618;
        --ink-2: #22343A;
        --muted: #5A7278;
        --primary: #0E9C90;
        --primary-2: #0B746C;
        --primary-ink: #F2FEFC;
        --accent: #B8730A;
        --accent-soft: rgba(245, 165, 36, 0.16);
        --danger: #D92D20;
        --success: #0E8F6B;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: grid; place-items: center; padding: 20px;
      background:
        radial-gradient(720px 460px at 12% -10%, rgba(15, 182, 166, 0.16), transparent 60%),
        radial-gradient(560px 420px at 100% 4%, rgba(245, 165, 36, 0.1), transparent 58%),
        var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .panel {
      width: min(440px, 100%);
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--surface);
      backdrop-filter: blur(16px) saturate(140%);
      box-shadow: 0 30px 60px -40px rgba(0, 0, 0, 0.85);
      text-align: center;
    }
    .mark {
      display: grid; place-items: center;
      width: 44px; height: 44px; margin: 0 auto 14px;
      border-radius: 13px;
      background: linear-gradient(140deg, var(--primary), var(--primary-2));
      color: var(--primary-ink); font-weight: 800; font-size: 14px;
    }
    .panel h1 { margin: 0; font-size: 21px; letter-spacing: -0.01em; }
    .panel p { margin: 9px 0 18px; color: var(--muted); font-size: 12.5px; line-height: 1.6; }
    .notice {
      margin: 0 0 16px; padding: 12px 14px;
      border: 1px solid rgba(245, 165, 36, 0.34); border-radius: 12px;
      background: var(--accent-soft); color: var(--ink-2);
      font-size: 12.5px; line-height: 1.55; text-align: left;
    }
    .notice strong { display: block; margin-bottom: 2px; color: var(--accent); }
    .scan-channel { display: grid; gap: 7px; margin-bottom: 16px; text-align: left; }
    .scan-channel label { color: var(--ink-2); font-size: 12.5px; font-weight: 600; }
    .scan-channel select {
      width: 100%; min-height: 40px; padding: 8px 10px;
      border: 1px solid var(--line-strong); border-radius: 10px;
      background: var(--surface-2); color: var(--ink); font: inherit; font-size: 13px;
    }
    .scan-channel select:focus-visible { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(15, 182, 166, 0.28); }
    .scan-channel small { color: var(--muted); font-size: 11.5px; }
    .qr {
      width: min(260px, 100%); height: auto; aspect-ratio: 1;
      margin: 0 auto 16px;
      display: grid; place-items: center;
      border: 1px dashed var(--line-strong); border-radius: 14px;
      background: var(--surface-2); color: var(--muted); font-size: 12.5px; overflow: hidden;
    }
    .qr img { width: 100%; height: 100%; object-fit: contain; border-radius: 13px; background: #fff; user-select: none; -webkit-user-drag: none; }
    .state { min-height: 24px; color: var(--ink-2); font-size: 12.5px; }
    .state.error { color: var(--danger); }
    .state.ok { color: var(--success); }
    .expiry { min-height: 20px; margin-top: 3px; color: var(--accent); font-family: var(--mono); font-size: 11.5px; }
    .hint { margin-top: 18px; padding: 11px 12px; border-radius: 10px; background: var(--surface-2); color: var(--muted); font-size: 11.5px; line-height: 1.6; text-align: left; }
    .btn {
      width: 100%; padding: 11px 14px;
      border: 0; border-radius: 10px;
      background: linear-gradient(140deg, var(--primary), var(--primary-2));
      color: var(--primary-ink); font: inherit; font-size: 13px; font-weight: 680; cursor: pointer;
    }
    .btn:disabled { opacity: 0.55; cursor: default; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <main class="panel">
    <div class="mark">YB</div>
    <h1>wxcode-YYB 账号授权</h1>
    <p id="intro">这是一次性扫码授权链接，扫码账号不匹配时不会写入任何账号数据。</p>
    <div class="notice"><strong>仅限现场扫码</strong>请直接使用微信扫一扫完成授权，不要保存、转发或从相册识别二维码。刷新页面只会重新生成二维码，不会提前消耗授权链接。</div>
    <div class="scan-channel"><label for="scanProduct">扫码渠道</label><select id="scanProduct"><option value="appstore">YYB</option><option value="pcmgr">PCMgr</option><option value="gameassist">GameAssist</option></select><small id="channelHint">扫码成功后自动保存。</small></div>
    <div class="qr" id="qr">正在生成二维码…</div>
    <section id="linkMulti" class="hidden" aria-label="多渠道授权"></section>
    <div class="state" id="state" role="status">链接校验中</div>
    <div class="expiry" id="expiry"></div>
    <button class="btn hidden" id="retry" type="button">重新生成二维码</button>
    <div class="hint" id="linkHint">请确认微信中登录的是要授权的账号。链接只能成功使用一次，并会在有效期结束后自动失效。</div>
  </main>
  <script src="/static/js/scan-channel.js?v=094"></script>
<script src="/static/js/account-link-multi.js?v=0302"></script>
  <script>
    const token=location.pathname.split('/').filter(Boolean).pop();
    const $=id=>document.getElementById(id);let sid='',timer=null,expiryTimer=null,pollBusy=false,linkExpiresAt=0,saveAttempts=0;
	let generation=0,meta=null,selectedProduct='',confirmedProduct='',saving=false,completed=false;
    $('scanProduct').replaceChildren(...scanChannels().map(channel=>{const option=document.createElement('option');option.value=channel.id;option.textContent=channel.name;return option;}));
    async function api(path,options={}){const response=await fetch(`/account-link/${encodeURIComponent(token)}${path}`,{cache:'no-store',...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});const text=await response.text();let data;try{data=text?JSON.parse(text):null}catch{const error=new Error(`服务返回异常（HTTP ${response.status}）`);error.status=response.status;throw error}if(!response.ok){const error=new Error(data?.msg||'链接已失效或授权失败');error.status=response.status;error.data=data?.data;throw error}return data.data??data}
    function setState(text,kind=''){ $('state').textContent=text;$('state').className=`state ${kind}` }
    function stop(){if(timer){clearInterval(timer);timer=null}}
    function stopExpiry(){if(expiryTimer){clearInterval(expiryTimer);expiryTimer=null}}
    function renderExpiry(){if(!linkExpiresAt)return;const seconds=Math.max(0,linkExpiresAt-Math.floor(Date.now()/1000));if(seconds<=0){$('expiry').textContent='授权链接已过期';$('expiry').className='expiry state error';stop();window.AccountLinkMulti?.stop();if(expiryTimer){clearInterval(expiryTimer);expiryTimer=null}setState('授权链接已过期，请让发起方重新生成','error');$('retry').classList.add('hidden');return}const minutes=Math.floor(seconds/60),rest=seconds%60;$('expiry').textContent=`授权链接剩余 ${minutes}分${String(rest).padStart(2,'0')}秒`;}
    function startExpiry(expiresAt){if(expiresAt)linkExpiresAt=Number(expiresAt);stopExpiry();renderExpiry();expiryTimer=setInterval(renderExpiry,1000)}
    function renderChannelHint(){
      const switching=meta?.kind==='update'&&selectedProduct!==meta.source_product;
      $('channelHint').textContent=switching?'本次切换渠道，扫码成功后替换原 ID 授权。':'扫码成功后自动保存。';
      $('intro').textContent=meta?.kind==='update'
        ?`${switching?'切换':'更新'} ${meta.target||'账号 ID '+meta.account_id}，请使用原微信扫码。`
        :'可扫码添加新账号，授权成功后自动保存。';
    }
    async function create(){
      if(saving)return;
      const currentGeneration=++generation;stop();saveAttempts=0;
      const previous=sid;sid='';
      if(previous){try{await api(`/qr/${encodeURIComponent(previous)}/cancel`,{method:'POST',body:'{}'});}catch{}}
      if(currentGeneration!==generation)return;
      $('retry').classList.add('hidden');$('qr').textContent='正在生成二维码…';setState('请使用微信扫码');
      try{
        const data=await api('/qr',{method:'POST',body:JSON.stringify({product:selectedProduct,confirm_switch:confirmedProduct===selectedProduct})});
        if(currentGeneration!==generation){api(`/qr/${encodeURIComponent(data.session_id)}/cancel`,{method:'POST',body:'{}'}).catch(()=>{});return;}
        startExpiry(data.link_expires_at);sid=data.session_id;
        $('qr').innerHTML=`<img alt="仅限现场扫码，不要保存二维码" draggable="false" src="/account-link/${encodeURIComponent(token)}/qr/${encodeURIComponent(sid)}/image?t=${Date.now()}">`;
        timer=setInterval(poll,1500);await poll();
      }catch(error){
        if(currentGeneration!==generation)return;
        $('qr').textContent='二维码生成失败';setState(error.message,'error');
        if(error.status!==410)$('retry').classList.remove('hidden');
      }
    }
    async function poll(){
      const current=sid,currentGeneration=generation;
      if(!current||pollBusy===current||saving)return;
      pollBusy=current;
      try{
        const result=await api(`/qr/${encodeURIComponent(current)}/poll`);
        if(current!==sid||currentGeneration!==generation)return;
        if(result.status==='pending'){setState('等待扫码');}
        else if(result.status==='scanned'){setState('已扫码，请在手机上确认授权');}
        else if(result.status==='authorized'||result.status==='confirmed'){
          stop();
          if(saveAttempts>=12){setState('账号保存超时，请重新生成二维码','error');$('retry').classList.remove('hidden');return;}
          saveAttempts++;saving=true;$('scanProduct').disabled=true;$('retry').disabled=true;
          setState('授权成功，正在保存账号');
          const account=await api(`/qr/${encodeURIComponent(current)}/confirm`,{method:'POST',body:'{}'});
          if(current!==sid||currentGeneration!==generation)return;
          saveAttempts=0;sid='';completed=true;stopExpiry();$('expiry').textContent='授权链接已消费';$('expiry').className='expiry state ok';$('qr').textContent='✓';
          setState(`授权完成：账号 ID ${account.id}，请关闭此标签页`,'ok');
          $('intro').textContent=account.warning||'本次授权已完成，链接已经失效。请直接关闭此标签页。';
          if(account.warning)$('intro').style.color='#9a5900';
        }else if(['expired','cancelled','unknown'].includes(result.status)){
          stop();setState('二维码已过期，授权链接仍有效，可重新生成','error');$('retry').classList.remove('hidden');
        }
      }catch(error){
        if(current!==sid||currentGeneration!==generation)return;
        if(error.status===410){stop();stopExpiry();setState('授权链接已失效，请让发起方重新生成','error');$('retry').classList.add('hidden');}
        else if(error.status===404||error.status===409&&!error.message.startsWith('buffer not ready')){
          stop();setState(error.message,'error');$('retry').classList.remove('hidden');
        }else if((error.status===409||error.status===502)&&saveAttempts>0&&saveAttempts<12){
          setState('授权已确认，正在自动完成账号保存');setTimeout(()=>{if(current===sid&&currentGeneration===generation)poll();},1500);
        }else{setState(error.message||'网络暂时波动，正在自动重试','error');if(!timer)$('retry').classList.remove('hidden');}
      }finally{
        saving=false;$('scanProduct').disabled=completed;$('retry').disabled=false;
        if(pollBusy===current)pollBusy=false;
      }
    }
    $('retry').addEventListener('click',create);
    $('scanProduct').addEventListener('change',async()=>{
      const next=$('scanProduct').value;
      if(saving){$('scanProduct').value=selectedProduct;return;}
      stop();++generation;$('scanProduct').disabled=true;
      try{
        if(meta.kind==='update'&&!await confirmScanChannelSwitch({from:selectedProduct,to:next,account:`账号 ID ${meta.account_id}`})){
          $('scanProduct').value=selectedProduct;timer=setInterval(poll,1500);return;
        }
        selectedProduct=next;confirmedProduct=meta.kind==='update'?next:'';
        renderChannelHint();await create();
      }finally{$('scanProduct').disabled=completed;}
    });
    api('/meta').then(data=>{
      if(data.allow_multi_channel){startExpiry(data.expires_at);AccountLinkMulti.init({api,meta:data,setState,onFinish:()=>{stopExpiry();$('expiry').textContent='授权链接已关闭';}});return;}
      meta=data;selectedProduct=data.product;confirmedProduct=data.switch_confirmed?data.product:'';
      $('scanProduct').value=selectedProduct;startExpiry(data.expires_at);renderChannelHint();create();
    }).catch(error=>{$('qr').textContent='链接不可用';setState(error.message,'error');$('scanProduct').disabled=true;});
  </script>
</body>
</html>
