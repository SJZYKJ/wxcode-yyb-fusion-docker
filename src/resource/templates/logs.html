<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="refresh" content="0;url=/runs?view=system">
  <title>系统日志已并入运行与日志 - wxcode-YYB</title>
  <script>try{var theme=localStorage.getItem("yyb-skin");if(theme==="light"||theme==="dark")document.documentElement.dataset.theme=theme}catch(e){}</script>
  <style>
    :root { color-scheme: dark; }
    @media (prefers-color-scheme: light) { :root { color-scheme: light; } }
    body {
      margin: 0; min-height: 100vh;
      display: grid; place-items: center;
      background: #0B1014; color: #E8F1F2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    }
    @media (prefers-color-scheme: light) { body { background: #F2F6F6; color: #0C1618; } }
    .card {
      width: min(480px, calc(100vw - 32px));
      padding: 28px 26px;
      border: 1px solid rgba(15, 182, 166, 0.35);
      border-radius: 16px;
      background: rgba(19, 30, 36, 0.72);
      text-align: center;
    }
    @media (prefers-color-scheme: light) { .card { background: #fff; border-color: rgba(14, 156, 144, 0.3); } }
    h1 { margin: 0 0 10px; font-size: 18px; }
    p { margin: 0 0 18px; font-size: 13px; line-height: 1.7; opacity: 0.78; }
    a {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 38px; padding: 8px 18px;
      border-radius: 10px; text-decoration: none;
      background: linear-gradient(140deg, #0FB6A6, #0E7C74);
      color: #04211F; font-weight: 620; font-size: 13px;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>系统日志已并入「运行与日志」</h1>
    <p>新的页面把任务、账号日志、调用记录与系统日志合成一页，正在自动跳转…</p>
    <a href="/runs?view=system">手动跳转到系统日志</a>
  </main>
</body>
</html>
