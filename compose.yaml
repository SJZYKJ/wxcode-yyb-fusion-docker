# ============================================================
# wxcode-YYB 网关 - 纯 Docker 部署
#
# 默认走「拉取预构建镜像」，一条命令即可启动：
#     cp .env.example .env && docker compose up -d
#
# 想用源码在本机重新构建（改了 Go 代码后），改用：
#     docker compose -f compose.build.yaml up -d --build
#   或先跑 ./build-gateway.sh 交叉编译 gateway/yyb-go-{amd64,arm64}，
#   再 build —— 见 README-DOCKER.md「重新出镜像」。
#
# 架构：单服务 yyb-go 网关；微信扫码登录为原生能力（浏览器 /scan）
# 取码链路：/scan 显示二维码 -> 手机微信扫码 -> login_buffer 自动刷新
# 详情见 README-DOCKER.md
# ============================================================
name: wxcode-yyb-fusion-docker

services:
  # ---------- 融合网关容器（单服务） ----------
  yyb-go:
    platform: "${YYB_PLATFORM:-linux/amd64}"
    image: "${IMAGE_REPO:-chungg/wxcode-yyb-fusion}:${IMAGE_TAG:-latest}"
    container_name: wxcode-yyb-gateway
    restart: unless-stopped
    command:
      - -host
      - 0.0.0.0
      - -port
      - "8088"
      - -resource-root
      - /app/resource
      - -keepalive-interval
      - ${YYB_KEEPALIVE_INTERVAL:-30m}
      - -keepalive-ahead
      - ${YYB_KEEPALIVE_AHEAD:-45m}
    environment:
      PANEL_TYPE: ${PANEL_TYPE:-qinglong}
      QL_URL: ${QL_URL:-}
      QL_CLIENT_ID: ${QL_CLIENT_ID:-}
      QL_CLIENT_SECRET: ${QL_CLIENT_SECRET:-}
      DAIDAI_URL: ${DAIDAI_URL:-}
      DAIDAI_APP_KEY: ${DAIDAI_APP_KEY:-}
      DAIDAI_APP_SECRET: ${DAIDAI_APP_SECRET:-}
      YYB_QINGLONG_SERVER: ${YYB_QINGLONG_SERVER:-}
      YYB_DNS_SERVERS: ${YYB_DNS_SERVERS:-223.5.5.5:53,119.29.29.29:53}
      YYB_AUTH_DRIVER: ${YYB_AUTH_DRIVER:-sqlite}
      YYB_AUTH_DSN: ${YYB_AUTH_DSN:-}
      YYB_AUTH_MYSQL_DSN: ${YYB_AUTH_MYSQL_DSN:-}
      YYB_ADMIN_USER: ${YYB_ADMIN_USER:-admin}
      YYB_ADMIN_PASSWORD: ${YYB_ADMIN_PASSWORD:-}
      YYB_COOKIE_SECURE: ${YYB_COOKIE_SECURE:-false}
      # 访问令牌：取码接口默认必须鉴权（fail-closed）。留空时网关会自动生成
      # 一个随机令牌、存进数据库（持久化，重启不变）并打印到容器日志，
      # 不会裸奔。要让脚本能调用，两边配同一个值即可（见 README-DOCKER.md 第五节）。
      YYB_API_TOKEN: ${YYB_API_TOKEN:-}
      # 显式关闭取码接口鉴权（⚠️ 端口可达即可列出全部 openid 并取码）
      YYB_ALLOW_NO_AUTH: ${YYB_ALLOW_NO_AUTH:-false}
      # 公开注册开关（默认关闭；关闭时仅内网可完成首次管理员注册）
      YYB_ALLOW_REGISTRATION: ${YYB_ALLOW_REGISTRATION:-false}
      # 部署在反向代理后面时才开；直连暴露时保持 false，避免伪造 X-Forwarded-For
      YYB_TRUST_PROXY: ${YYB_TRUST_PROXY:-false}
      # 注册邮箱验证码。任意一项留空则注册会被明确拒绝并提示联系管理员。
      YYB_SMTP_HOST: ${YYB_SMTP_HOST:-}
      YYB_SMTP_PORT: ${YYB_SMTP_PORT:-}
      YYB_SMTP_USERNAME: ${YYB_SMTP_USERNAME:-}
      YYB_SMTP_PASSWORD: ${YYB_SMTP_PASSWORD:-}
      YYB_SMTP_FROM: ${YYB_SMTP_FROM:-}
      YYB_SMTP_TLS: ${YYB_SMTP_TLS:-true}
      TZ: ${TZ:-Asia/Shanghai}
      # ---- 可选高级开关（全部可选，留空即用内置默认值）----
      # 协议路由令牌：与 YYB_API_TOKEN 是两道独立的闸门，默认留空=不启用；
      # 需要时再填随机长串，两边都配同一套即可。
      YYB_PROTOCOL_TOKEN: ${YYB_PROTOCOL_TOKEN:-}
      # 集成接口（/integration/*）的令牌，控制面调用时使用。
      YYB_INTEGRATION_TOKEN: ${YYB_INTEGRATION_TOKEN:-}
      # 同步到面板的账号引用方式：id（默认）或 openid。
      YYB_QINGLONG_REF_MODE: ${YYB_QINGLONG_REF_MODE:-id}
      # 青龙脚本仓库地址（运行管理按脚本目录建任务时用）。
      YYB_QINGLONG_REPO: ${YYB_QINGLONG_REPO:-}
      # 桌面微信快速授权（实验特性，默认关闭）。
      YYB_ENABLE_PC_LOGIN: ${YYB_ENABLE_PC_LOGIN:-false}
      # 协议设备标识：stable（每个账号固定设备，默认）/ random（旧行为）。
      YYB_DEVICE_IDENTITY: ${YYB_DEVICE_IDENTITY:-stable}
      # AS 刷新策略：legacy_auth（默认）/ source。
      YYB_APPSTORE_REFRESH_MODE: ${YYB_APPSTORE_REFRESH_MODE:-legacy_auth}
      # 掉线通知（账号授权失效时推送一次）：serverchan / pushplus / qywx，留空关闭。
      YYB_NOTIFY_CHANNEL: ${YYB_NOTIFY_CHANNEL:-}
      YYB_NOTIFY_TOKEN: ${YYB_NOTIFY_TOKEN:-}
      YYB_NOTIFY_TOPIC: ${YYB_NOTIFY_TOPIC:-}
      YYB_NOTIFY_ACCOUNT_PUSH: ${YYB_NOTIFY_ACCOUNT_PUSH:-true}
      # 取码熔断/限速/登录预算（防封）。默认已开启，off 可回到旧行为。
      YYB_CIRCUIT_BREAKER: ${YYB_CIRCUIT_BREAKER:-on}
      YYB_CODE_MIN_GAP: ${YYB_CODE_MIN_GAP:-3s}
      YYB_CODE_MAX_WAIT: ${YYB_CODE_MAX_WAIT:-20s}
      YYB_LOGIN_BUDGET: ${YYB_LOGIN_BUDGET:-3}
      YYB_LOGIN_WINDOW: ${YYB_LOGIN_WINDOW:-10m}
      YYB_FRESH_SESSION_WINDOW: ${YYB_FRESH_SESSION_WINDOW:-}
      YYB_CODE_DENY_APPIDS: ${YYB_CODE_DENY_APPIDS:-}
      YYB_CODE_ALLOW_APPIDS: ${YYB_CODE_ALLOW_APPIDS:-}
      YYB_CODE_DYNAMIC_DENY: ${YYB_CODE_DYNAMIC_DENY:-}
      YYB_CODE_DYNAMIC_DENY_THRESHOLD: ${YYB_CODE_DYNAMIC_DENY_THRESHOLD:-}
      # 版本检查与维护 socket（默认关闭；开了需要额外挂载 socket 所在目录）。
      GIN_MODE: release
    volumes:
      # 数据目录默认落在 compose 文件同级的 ./data 下；
      # 想放到别处（例如 NAS 的固定盘位）就改 .env 里的 DATA_DIR。
      - ${DATA_DIR:-./data}/db:/app/resource/db
      - ${DATA_DIR:-./data}/avatars:/app/resource/avatars
      - ${DATA_DIR:-./data}/qr:/app/resource/qr
    ports:
      - "${YYB_BIND_ADDRESS:-0.0.0.0}:${YYB_PORT:-8088}:8088"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8088/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    # entrypoint 需要 root 修复 bind-mount 数据目录权限（CHOWN/FOWNER/DAC_OVERRIDE）
    # 并用 su-exec 降权到 yyb（SETUID/SETGID）；其余能力全部丢弃
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    cap_drop:
      - ALL
